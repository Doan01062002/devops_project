version: '3.8'

services:
  # Phần 1: PostgreSQL Container
  database:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rikkei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rikkei123}
      POSTGRES_DB: rikkei_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Không expose ra ngoài internet (không dùng ports) nên chỉ cho phép kết nối nội bộ
    networks:
      - devops-network

  # Phần 2: Frontend Container
  frontend:
    image: ${DOCKER_USERNAME}/todolist-frontend:latest
    container_name: frontend
    restart: unless-stopped
    networks:
      - devops-network

  # Phần 3: Web Server Nginx - Reverse Proxy Container
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - frontend
    networks:
      - devops-network

volumes:
  # Cấu hình Volume để dữ liệu không bị mất khi container restart (Yêu cầu)
  postgres_data:

networks:
  devops-network:
    driver: bridge
